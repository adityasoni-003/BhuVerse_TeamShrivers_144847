version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: geodrishti_db
    environment:
      - POSTGRES_USER=geodrishti
      - POSTGRES_PASSWORD=geodrishti_pass
      - POSTGRES_DB=geodrishti
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    restart: always

volumes:
  postgis_data:
